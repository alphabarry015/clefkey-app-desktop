# Build + publie les installateurs Windows + macOS sur GitHub Releases.
# Déclenché par un tag v* (ex. git tag v0.1.2 && git push --tags)
# ou manuellement via « Run workflow ».

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend deps
        run: npm ci

      - name: Assemble frontend
        run: npm run frontend:assemble

      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          releaseName: Clefkey ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          releaseBody: |
            ## Clefkey Desktop

            Client zero-knowledge (Windows + macOS).

            - API : `https://clefkey.vercel.app`
            - Page téléchargement : https://clefkey.vercel.app/download/
            - Windows : `Clefkey-Setup.exe`
            - macOS : `Clefkey-macOS.dmg`
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      - name: Publish stable Windows alias
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v${{ github.run_number }}" }
          $dir = "src-tauri/target/release/bundle/nsis"
          $src = Get-ChildItem -Path $dir -Filter "*setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $src) { throw "NSIS installer introuvable dans $dir" }
          Copy-Item -Force $src.FullName "Clefkey-Setup.exe"
          gh release upload $tag "Clefkey-Setup.exe" --clobber --repo "${{ github.repository }}"

  publish-macos:
    needs: publish-windows
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend deps
        run: npm ci

      - name: Assemble frontend
        run: npm run frontend:assemble

      - name: Build Tauri (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Build non notarisé (OK pour distribution GitHub ; Gatekeeper demandera « Ouvrir »).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          releaseName: Clefkey ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          releaseDraft: false
          prerelease: false
          args: --bundles dmg --target aarch64-apple-darwin

      - name: Publish stable macOS alias
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${{ github.run_number }}"
          fi
          SRC="$(find src-tauri/target -name '*.dmg' -type f 2>/dev/null | head -n 1 || true)"
          if [ -z "${SRC}" ]; then
            echo "DMG introuvable — arborescence target :" >&2
            find src-tauri/target -type d -name bundle 2>/dev/null || true
            find src-tauri/target -name '*.dmg' 2>/dev/null || true
            exit 1
          fi
          echo "DMG source: ${SRC}"
          cp -f "${SRC}" Clefkey-macOS.dmg
          gh release upload "${TAG}" Clefkey-macOS.dmg --clobber --repo "${{ github.repository }}"
