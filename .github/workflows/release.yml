# Build + publie l’installateur Windows sur GitHub Releases.
# Déclenché par un tag v* (ex. git tag v0.1.0 && git push --tags)
# ou manuellement via « Run workflow ».

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend deps
        run: npm ci

      - name: Assemble frontend
        run: npm run frontend:assemble

      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          releaseName: Clefkey ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          releaseBody: |
            Installateur Windows de **Clefkey** (desktop).

            - API par défaut : `https://clefkey.vercel.app`
            - Téléchargement direct (bouton site) :
              `https://github.com/alphabarry015/clefkey-app-desktop/releases/latest/download/Clefkey-Setup.exe`
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      # Nom stable pour le bouton « Télécharger » du site (sans numéro de version dans l’URL).
      - name: Publish stable installer alias
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v${{ github.run_number }}" }
          $dir = "src-tauri/target/release/bundle/nsis"
          $src = Get-ChildItem -Path $dir -Filter "*setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $src) { throw "NSIS installer introuvable dans $dir" }
          Copy-Item -Force $src.FullName "Clefkey-Setup.exe"
          gh release upload $tag "Clefkey-Setup.exe" --clobber --repo "${{ github.repository }}"
