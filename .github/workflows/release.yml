# Build + publie l’installateur Windows sur GitHub Releases.
# Déclenché par un tag v* (ex. git tag v0.1.0 && git push --tags)
# ou manuellement via « Run workflow ».

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend deps
        run: npm ci

      - name: Assemble frontend
        run: npm run frontend:assemble

      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          releaseName: Clefkey ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          releaseBody: |
            Installateur Windows de **Clefkey** (desktop).

            - API par défaut : `https://clefkey.vercel.app`
            - Téléchargement : assets ci-dessous (NSIS / MSI)
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
